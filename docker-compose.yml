version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: cryptotrace-db
    environment:
      POSTGRES_USER: cryptotrace
      POSTGRES_PASSWORD: cryptotrace
      POSTGRES_DB: cryptotrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptotrace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
